<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: palm. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Leans out to sea. Many on screen at once: keep it simple. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1232" height="636" viewBox="0 -220 1232 636">
  <g id="BACKGROUND"><rect x="0" y="-220" width="1232" height="636" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="1232" height="416" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="96" y="100" width="200" height="200" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="96" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="96" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="96" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">25 × 25 px in game</text><rect x="376" y="96" width="200" height="272" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="376" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="376" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="376" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">25 × 34 px in game</text><rect x="688" y="96" width="200" height="272" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="688" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="688" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="688" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">25 × 34 px in game</text><rect x="936" y="96" width="200" height="272" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="936" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="936" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="936" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">25 × 34 px in game</text></g>
  <g id="LABELS"><text x="1212" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">palm — Beach palm (~22 m) — 34 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
