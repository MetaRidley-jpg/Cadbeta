<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: chair. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Seen from the side across the table. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="752" height="460" viewBox="0 -220 752 460">
  <g id="BACKGROUND"><rect x="0" y="-220" width="752" height="460" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="752" height="240" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="48" y="56" width="128" height="120" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="48" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="48" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="48" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">16 × 15 px in game</text><rect x="224" y="48" width="128" height="144" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="224" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="224" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="224" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">16 × 18 px in game</text><rect x="400" y="48" width="128" height="144" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="400" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="400" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="400" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">16 × 18 px in game</text><rect x="576" y="48" width="128" height="144" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="576" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="576" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="576" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">16 × 18 px in game</text></g>
  <g id="LABELS"><text x="732" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">chair — Seat chair (manager seats) — 18 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
