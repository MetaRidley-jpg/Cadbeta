<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: foundry (flat sprite). Draw on YOUR_ART. Do not resize the
     artboard. 8 x 8 units = 1 pixel in game. Seated at the table end; faces the middle. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1500" viewBox="0 -220 1024 1500">
  <g id="BACKGROUND"><rect x="0" y="-220" width="1024" height="1500" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="1024" height="1280" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="0" y="0" width="1024" height="1280" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/></g>
  <g id="LABELS"><text x="0" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">foundry</text>
    <text x="0" y="-70" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">Forge Mummy (Femur Foundry) · 128 × 160 px in game</text></g>
  <g id="YOUR_ART"></g>
</svg>
