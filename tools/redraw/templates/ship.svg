<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: ship. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Seen from high above; deck detail matters most (TOP view). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="928" height="668" viewBox="0 -220 928 668">
  <g id="BACKGROUND"><rect x="0" y="-220" width="928" height="668" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="928" height="448" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="56" y="48" width="104" height="352" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="56" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="56" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="56" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">13 × 44 px in game</text><rect x="208" y="172" width="352" height="104" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="208" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="208" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="208" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">44 × 13 px in game</text><rect x="616" y="172" width="104" height="104" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="616" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="616" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="616" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">13 × 13 px in game</text><rect x="776" y="172" width="104" height="104" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="776" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="776" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="776" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">13 × 13 px in game</text></g>
  <g id="LABELS"><text x="908" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">ship — Flak / artillery ship (ocean) — 13 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
