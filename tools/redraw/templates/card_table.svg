<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: card_table. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Rim + pedestal. The felt on top is a separate flat texture. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2512" height="812" viewBox="0 -220 2512 812">
  <g id="BACKGROUND"><rect x="0" y="-220" width="2512" height="812" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="2512" height="592" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="48" y="48" width="592" height="496" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="48" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="48" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="48" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">74 × 62 px in game</text><rect x="688" y="256" width="496" height="80" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="688" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="688" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="688" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">62 × 10 px in game</text><rect x="1232" y="256" width="592" height="80" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="1232" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="1232" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="1232" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">74 × 10 px in game</text><rect x="1872" y="256" width="592" height="80" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="1872" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="1872" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="1872" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">74 × 10 px in game</text></g>
  <g id="LABELS"><text x="2492" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">card_table — Card table (blackjack + hold'em) — 10 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
