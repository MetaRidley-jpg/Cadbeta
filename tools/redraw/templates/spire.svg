<!-- Cadavire redraw template: spire. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Dark rock + moss tiers (your cove references). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="716" viewBox="0 -220 1200 716">
  <g id="BACKGROUND"><rect x="0" y="-220" width="1200" height="716" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="1200" height="496" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="96" y="176" width="160" height="152" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="96" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="96" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="96" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">20 × 19 px in game</text><rect x="376" y="64" width="152" height="384" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="376" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="376" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="376" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">19 × 48 px in game</text><rect x="672" y="64" width="160" height="384" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="672" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="672" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="672" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">20 × 48 px in game</text><rect x="944" y="64" width="160" height="384" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="944" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="944" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="944" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">20 × 48 px in game</text></g>
  <g id="LABELS"><text x="1180" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">spire — Mossy sea stack / island spire — 48 slices</text></g>
