<!-- Cadavire redraw template: gunship. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Four rotors (weak spots) + belly cannon. Rotor and cannon positions are tied to code: keep them where they are. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1712" height="684" viewBox="0 -220 1712 684">
  <g id="BACKGROUND"><rect x="0" y="-220" width="1712" height="684" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="1712" height="464" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="56" y="64" width="360" height="352" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="56" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="56" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="56" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">45 × 44 px in game</text><rect x="464" y="144" width="352" height="184" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="464" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="464" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="464" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">44 × 23 px in game</text><rect x="888" y="144" width="360" height="184" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="888" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="888" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="888" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">45 × 23 px in game</text><rect x="1296" y="144" width="360" height="184" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="1296" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="1296" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="1296" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">45 × 23 px in game</text></g>
  <g id="LABELS"><text x="1692" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">gunship — QUAD GUNSHIP boss (wave 6) — 23 slices</text></g>
  <g id="YOUR_ART"></g>
