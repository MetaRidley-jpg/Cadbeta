<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: asteroid. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Round: carved as a lathe. Seen big and close. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1008" height="508" viewBox="0 -220 1008 508">
  <g id="BACKGROUND"><rect x="0" y="-220" width="1008" height="508" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="1008" height="288" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="48" y="48" width="192" height="192" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="48" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="48" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="48" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">24 × 24 px in game</text><rect x="288" y="48" width="192" height="192" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="288" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="288" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="288" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">24 × 24 px in game</text><rect x="528" y="48" width="192" height="192" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="528" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="528" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="528" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">24 × 24 px in game</text><rect x="768" y="48" width="192" height="192" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="768" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="768" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="768" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">24 × 24 px in game</text></g>
  <g id="LABELS"><text x="988" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">asteroid — Asteroid (wave 5 impact) — 24 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
