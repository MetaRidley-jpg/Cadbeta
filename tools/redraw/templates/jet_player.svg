<!-- Cadavire redraw template: jet_player. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Grey helmet nose, ONE red cyclops band (it shimmers in game). Seen mostly from behind and above. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1256" height="588" viewBox="0 -220 1256 588">
  <g id="BACKGROUND"><rect x="0" y="-220" width="1256" height="588" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="1256" height="368" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="48" y="64" width="248" height="256" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="48" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="48" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="48" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">31 × 32 px in game</text><rect x="344" y="136" width="272" height="96" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="344" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="344" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="344" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">34 × 12 px in game</text><rect x="664" y="136" width="248" height="96" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="664" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="664" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="664" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">31 × 12 px in game</text><rect x="960" y="136" width="248" height="96" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="960" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="960" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="960" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">31 × 12 px in game</text></g>
  <g id="LABELS"><text x="1236" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">jet_player — Your jet (your concept sheet) — 12 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
