<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: hoop. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. A ring; needs a 2 px gap in the TOP view or the carver fills it. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800" height="492" viewBox="0 -220 800 492">
  <g id="BACKGROUND"><rect x="0" y="-220" width="800" height="492" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="800" height="272" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="48" y="120" width="176" height="32" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="48" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="48" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="48" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">22 × 4 px in game</text><rect x="272" y="48" width="32" height="176" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="272" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="272" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="272" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">4 × 22 px in game</text><rect x="352" y="48" width="176" height="168" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="352" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="352" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="352" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">22 × 21 px in game</text><rect x="576" y="48" width="176" height="168" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="576" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="576" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="576" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">22 × 21 px in game</text></g>
  <g id="LABELS"><text x="780" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">hoop — Speed hoop — 22 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
