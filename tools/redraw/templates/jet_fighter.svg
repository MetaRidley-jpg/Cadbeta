<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: jet_fighter. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Must read as 'enemy' at 9 px tall: strong silhouette, one loud color. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1064" height="540" viewBox="0 -220 1064 540">
  <g id="BACKGROUND"><rect x="0" y="-220" width="1064" height="540" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="1064" height="320" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="48" y="48" width="200" height="224" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="48" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="48" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="48" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">25 × 28 px in game</text><rect x="296" y="116" width="224" height="72" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="296" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="296" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="296" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">28 × 9 px in game</text><rect x="568" y="116" width="200" height="72" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="568" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="568" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="568" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">25 × 9 px in game</text><rect x="816" y="116" width="200" height="72" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="816" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="816" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="816" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">25 × 9 px in game</text></g>
  <g id="LABELS"><text x="1044" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">jet_fighter — Enemy fighter — 9 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
