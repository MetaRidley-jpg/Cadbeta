<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: kamikaze. Draw on YOUR_ART inside the boxes. Do not move or
     resize the artboard. REFERENCE, GUIDES and LABELS are ignored on import.
     Each 8 x 8 units = 1 pixel in game. Dives at you; small. Smoke trail is drawn by the game. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="760" height="524" viewBox="0 -220 760 524">
  <g id="BACKGROUND"><rect x="0" y="-220" width="760" height="524" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="760" height="304" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="48" y="48" width="104" height="208" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="48" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">TOP</text><text x="48" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from above · nose DOWN</text><text x="48" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">13 × 26 px in game</text><rect x="200" y="116" width="208" height="72" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="200" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">SIDE</text><text x="200" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">from the left · nose LEFT</text><text x="200" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">26 × 9 px in game</text><rect x="456" y="116" width="104" height="72" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/><text x="456" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">FRONT  ★ START HERE</text><text x="456" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">nose toward you</text><text x="456" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">13 × 9 px in game</text><rect x="608" y="116" width="104" height="72" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10"/><text x="608" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#00e5ff">BACK</text><text x="608" y="-72" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">tail toward you</text><text x="608" y="-34" font-family="Helvetica, Arial" font-size="30" fill="#bbbbbb">13 × 9 px in game</text></g>
  <g id="LABELS"><text x="740" y="-170" text-anchor="end" font-family="Helvetica, Arial" font-size="34" fill="#ffffff">kamikaze — Kamikaze drone — 9 slices</text></g>
  <g id="YOUR_ART"></g>
</svg>
