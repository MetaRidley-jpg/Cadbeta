<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadavire redraw template: explosion (flat sprite). Draw on YOUR_ART. Do not resize the
     artboard. 8 x 8 units = 1 pixel in game. Left to right, frame 1 = flash. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3072" height="604" viewBox="0 -220 3072 604">
  <g id="BACKGROUND"><rect x="0" y="-220" width="3072" height="604" fill="#1b1622"/></g>
  <g id="REFERENCE" opacity="0.45"><image x="0" y="0" width="3072" height="384" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/></g>
  <g id="GUIDES"><rect x="0" y="0" width="3072" height="384" fill="none" stroke="#ffd400" stroke-width="4" stroke-dasharray="16 10"/></g>
  <g id="LABELS"><text x="0" y="-120" font-family="Helvetica, Arial" font-weight="bold" font-size="44" fill="#ffd400">explosion</text>
    <text x="0" y="-70" font-family="Helvetica, Arial" font-size="30" fill="#ffffff">Explosion (8 frames, 48 px) · 384 × 48 px in game</text></g>
  <g id="YOUR_ART"></g>
</svg>
