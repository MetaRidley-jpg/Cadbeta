# Cadavire web build for iPhone / Safari (T: "iPhone and we will use web route").
# On every push to main: install Godot + the web export templates, run the test suites,
# export the "Web" preset (no threads: runs on plain GitHub Pages, no special headers),
# publish to GitHub Pages. A failed test blocks the publish.
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: Web build (iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot ${{ env.GODOT_VERSION }} + web export templates
        run: |
          set -euo pipefail
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/web_nothreads_release.zip" ]; then
            mkdir -p "$T"
            curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q -j /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d "$T"
          fi
          ~/godot/godot --version
          ls "$T"

      - name: Import
        run: ~/godot/godot --headless --path . --import || true

      - name: Bake sprite atlases (art/baked; the game loads them instead of baking ~6 s at match start)
        run: bash tools/bake_sprites.sh

      - name: Tests (a failure blocks the publish)
        run: CI=1 bash tools/run_tests.sh || { tail -40 build/test-logs/*.log; exit 1; }

      - name: Export Web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.wasm

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
